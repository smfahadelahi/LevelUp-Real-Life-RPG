name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Run Room and UI instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload generated Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: levelup-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: levelup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
